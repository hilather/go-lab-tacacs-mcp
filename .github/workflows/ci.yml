name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: auto

jobs:
  check:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Record toolchain versions
        run: |
          mkdir -p dist
          {
            echo "go=$(go version)"
            echo "gofmt=$(gofmt -h 2>&1 | head -n 1 || true)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
          } | tee dist/toolchain-versions.txt

      - name: Format check
        run: make lint

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 $(go list ./... | grep -v '/node_modules/')

      - name: Test
        run: make test

      - name: Test race
        run: make test-race

      - name: Fuzz seed smoke
        run: make fuzz-smoke

      - name: Web install
        run: npm --prefix web ci

      - name: Web typecheck
        run: npm --prefix web run typecheck

      - name: Web lint
        run: npm --prefix web run lint

      - name: Web test
        run: npm --prefix web test

      - name: Web build
        run: make web-build

      - name: Web e2e
        run: |
          npx --prefix web playwright install --with-deps chromium
          npm --prefix web run test:e2e

      - name: Secret scan
        run: make secrets

      - name: Registry check
        run: make check-registries

      - name: Generated-file drift
        run: make check-generated

      - name: Docs check
        run: make docs-check

      - name: Hook self-test
        run: make check-hooks

      - name: Release-notes script
        run: make check-release-notes

      - name: Cisco IOL lab skip (no operator image)
        env:
          TACLAB_IOL_IMAGE: ""
        run: go run ./tools/ciscolab -evidence dist/cisco-lab-evidence.json

      - name: Build
        run: make build

      - name: Help smoke
        run: ./bin/taclabd -h

      - uses: docker/setup-buildx-action@v3

      - name: Docker build check
        run: |
          set -euo pipefail
          docker buildx build --check --target runtime .
          docker buildx build --check --target runtime-ubuntu .
          docker buildx build --check --target runtime-rocky .

      - name: Compose config
        run: |
          set -euo pipefail
          labdir="$(mktemp -d)"
          go run ./tools/labgen -force -instance-id ci-compose "$labdir"
          docker compose -f deployments/compose/compose.yaml --project-directory "$labdir" config >/dev/null
          docker compose -f deployments/compose/compose.yaml -f deployments/compose/compose.tls-only.yaml --project-directory "$labdir" config >/dev/null
          docker compose -f deployments/compose/compose.yaml -f deployments/compose/compose.lab-test.yaml --project-directory "$labdir" config >/dev/null
          rm -rf "$labdir"

      - name: Upload toolchain and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            dist/toolchain-versions.txt
            dist/lab-test-report.json
            docs/generated/toolchain.md
            docs/generated/api-parity.md
            docs/generated/conformance.md
          if-no-files-found: warn
          retention-days: 30

  lab:
    name: compose-lab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Lab test
        run: make lab-test
      - name: Upload lab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-test-report
          path: dist/lab-test-report.json
          if-no-files-found: warn
          retention-days: 30

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
          cache-dependency-path: go.sum
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VER: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks
        run: gitleaks detect --source . --verbose --redact --config .gitleaks.toml

  gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [check, lab, govulncheck, gitleaks]
    if: always()
    steps:
      - name: Require every job
        run: |
          set -euo pipefail
          echo "check=${{ needs.check.result }}"
          echo "lab=${{ needs.lab.result }}"
          echo "govulncheck=${{ needs.govulncheck.result }}"
          echo "gitleaks=${{ needs.gitleaks.result }}"
          test "${{ needs.check.result }}" = success
          test "${{ needs.lab.result }}" = success
          test "${{ needs.govulncheck.result }}" = success
          test "${{ needs.gitleaks.result }}" = success
