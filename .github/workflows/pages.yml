name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-flight production deploy. A cancelled Pages deploy can
# leave the site unpublished; the next push still serializes on this group.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-github-pages
    if: github.repository == 'hilather/go-lab-tacacs-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GITHUB_TOKEN can deploy Pages but cannot create the site.
      - name: Require existing Actions Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "$status" == "404" ]]; then
            echo "::error::GitHub Pages is not enabled on ${GITHUB_REPOSITORY}. GITHUB_TOKEN cannot create the site (do not set configure-pages enablement: true). A repo admin must run: gh api --method POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
            exit 1
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Failed to read GitHub Pages config for ${GITHUB_REPOSITORY} (HTTP ${status}). Do not set configure-pages enablement: true."
            exit 1
          fi
          build_type="$(jq -r .build_type "$body")"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages build_type is '${build_type}', expected 'workflow'. Set Settings → Pages → Source to GitHub Actions, or: gh api --method PUT repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
