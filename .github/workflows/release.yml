name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (vX.Y.Z) when not running from a tag"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hilather/go-lab-tacacs-mcp

jobs:
  notes:
    name: release-notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: ver
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          bash ./tools/release-version.sh "$RAW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Generate release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x tools/release-notes.sh tools/release-notes_test.sh
          ./tools/release-notes_test.sh
          ./tools/release-notes.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: dist/RELEASE_NOTES.md

  wait-ci:
    name: wait-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for tag ci-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash ./tools/wait-tag-ci.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"

  images:
    name: image-${{ matrix.variant }}
    needs: [notes, wait-ci]
    if: always() && needs.notes.result == 'success' && (needs.wait-ci.result == 'success' || needs.wait-ci.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: distroless
            target: runtime
            suffix: ""
          - variant: ubuntu
            target: runtime-ubuntu
            suffix: "-ubuntu"
          - variant: rocky
            target: runtime-rocky
            suffix: "-rocky"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build metadata
        run: echo "BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ env.IMAGE }}:v${{ needs.notes.outputs.version }}${{ matrix.suffix }}
          build-args: |
            VERSION=v${{ needs.notes.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ env.BUILDTIME }}
          provenance: true
          sbom: true

  publish:
    name: github-release
    needs: [notes, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out="$(bash ./tools/release-version.sh "$RELEASE_REF")"
          tag="$(printf '%s\n' "$out" | sed -n 's/^tag=//p')"
          if [ -z "$tag" ] || [ "$tag" != "$RELEASE_REF" ]; then
            echo "release tag is not a valid version tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "TacLab ${tag}" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$tag" --title "TacLab ${tag}" --notes-file dist/RELEASE_NOTES.md
          fi
