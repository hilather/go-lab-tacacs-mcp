title = "TacLab secret scan"

[extend]
useDefault = true

[allowlist]
description = "Generated trees, published RFC test vectors, and lab fixtures that are not live secrets"
paths = [
  '''(^|/)web/node_modules/''',
  '''(^|/)web/dist/''',
  '''(^|/)\.git/''',
  '''(^|/)internal/credentials/testdata/''',
  # RADIUS RFC 2865/2866/2869/3579 hex dumps and independent lab vectors.
  # Future RADIUS RFC/lab fixtures belong here. Never allowlist live Compose secrets.
  '''(^|/)testdata/protocol/radius/''',
]
# Leak-detection canaries used only by RADIUS crypto tests. Not production material.
# generic-api-key matches `canarySecret = "..."` in git history; keep these exact.
regexes = [
  '''CANARY-RADIUS-SECRET-aa11''',
  '''CANARY-UNHIDE-PASSWORD-zz99''',
]
