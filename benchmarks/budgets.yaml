# TacLab 1.0 frozen microbenchmark budgets.
# Compare with benchstat on the same runner class. Do not weaken Argon2id to pass these.
schema_version: 1
frozen: "2026-08-13"
product: TacLab 1.0
policy:
  latency_regression_pct: 10
  alloc_regression_pct: 15
  header_decode_must_stay_alloc_free: true
reference_hardware:
  cpu: "Intel(R) Core(TM) i7-8750H CPU @ 2.20GHz"
  goarch: amd64
  goos: linux
  go: go1.24.5
  nproc: 12
  note: >
    First freeze. TLS handshake benches are noisy (post-handshake tickets, scheduler).
    Use max_ns_per_op as the CI tripwire; use ns_per_op_median as the benchstat baseline.
command: "go test -count=6 -bench=. -benchmem ./internal/tacacs/... ./internal/policy/... ./internal/state/... ./internal/aaa ./internal/radius/..."
excluded_from_make_bench:
  - internal/credentials.BenchmarkArgon2idVerify
  - internal/credentials.BenchmarkArgon2idVerifyParallel
load_profiles:
  authz_acct_250_conn_10min:
    status: not_run_in_qualification
    reason: "10-minute soak is an operator procedure; CI uses saturation + leak tests."
    evidence:
      - unit:internal/tacacs/server.TestEngineConnectionSaturation
      - unit:internal/tacacs/server.TestServeConnNoGoroutineLeak
      - race:internal/tacacs/server.TestConcurrentSingleConnectSessions
  authentication_kdf:
    status: separate_suite
    evidence:
      - bench:internal/credentials.BenchmarkArgon2idVerify
  admin_events:
    status: micro_only
    evidence:
      - bench:internal/events.BenchmarkEventAppend
      - bench:internal/events.BenchmarkEventReadPage
benches:
  - name: BenchmarkHeaderDecode
    pkg: internal/tacacs/codec
    ns_per_op_median: 10
    max_ns_per_op: 15
    allocs_per_op: 0
    bytes_per_op: 0
