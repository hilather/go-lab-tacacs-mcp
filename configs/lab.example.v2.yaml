# TacLab schema v2 combined lab baseline. Secrets are file references only.
# RADIUS/UDP access and accounting are a lab profile, not complete RADIUS.
# Reload is explicit (SIGHUP or config.reload). File-watch reload is off.
schema_version: 2

metadata:
  name: branch-routing-lab-v2
  description: Reproducible TACACS and RADIUS lab for router and switch testing
  labels:
    environment: lab
    owner: network-engineering

server:
  instance_id: taclab-01
  shutdown_grace: 15s
  startup_failure_mode: fail_closed
  admin_only: false
  log_level: info

runtime:
  persistence: memory
  allow_shadowing: true
  delete_baseline_behavior: tombstone
  reload_overlay_behavior: rebase
  reset_requires_scope: runtime:reset
  max_objects:
    users: 10000
    groups: 1000
    clients: 2000
    api_tokens: 1000

security:
  allow_environment_secrets: false
  strict_secret_files: true
  legacy_shared_secrets:
    minimum_length_characters: 16
    minimum_character_classes: 3
    reject_known_weak_values: true
    warn_on_reuse: true
    default_rotation_interval: 90d
    rotation_warning_before: 14d
  radius_shared_secrets:
    minimum_length_characters: 16
    minimum_character_classes: 3
    reject_known_weak_values: true
    warn_on_reuse: true
    default_rotation_interval: 90d
    rotation_warning_before: 14d

listeners:
  tacacs:
    legacy:
      enabled: true
      bind: 0.0.0.0:4949
      advertised_port: 49
      read_timeout: 15s
      write_timeout: 15s
      idle_timeout: 60s
      handshake_timeout: 10s
      max_connections: 4096
      max_sessions_per_connection: 1024
      max_packet_body_bytes: 65536
      single_connect:
        enabled: true
        max_lifetime: 10m
        idle_timeout: 60s
    tls:
      enabled: true
      bind: 0.0.0.0:4300
      advertised_port: 300
      read_timeout: 15s
      write_timeout: 15s
      idle_timeout: 60s
      handshake_timeout: 10s
      max_connections: 4096
      max_sessions_per_connection: 1024
      max_packet_body_bytes: 65536
      single_connect:
        enabled: true
        max_lifetime: 10m
        idle_timeout: 60s
      tls:
        minimum_version: TLS1.3
        identities:
          default_id: lab-default
          require_sni: false
          profiles:
            - id: lab-default
              server_names:
                - tacacs.lab.example
              certificate_chain:
                file: /etc/taclab/certs-public/server-chain.pem
              private_key:
                file: /run/secrets/tacacs_server_key
        client_authentication: require_and_verify_certificate
        client_ca_bundle:
          file: /etc/taclab/certs-public/client-ca.pem
        revocation:
          mode: configured_crl
          crl_bundle:
            file: /etc/taclab/certs-public/client-crl.pem
        session_resumption:
          enabled: true
          ticket_lifetime: 168h
          recheck_client_revocation: true
        reject_early_data: true
  radius:
    access:
      enabled: true
      required: true
      bind: 0.0.0.0:1812
      transport: udp
      max_packet_bytes: 4096
      message_authenticator: required
      limit_proxy_state: true
    accounting:
      enabled: true
      required: false
      bind: 0.0.0.0:1813
      transport: udp
      max_packet_bytes: 4096
  http:
    enabled: true
    bind: 0.0.0.0:8080
    read_header_timeout: 5s
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 60s
    max_request_body_bytes: 2097152
    trusted_proxy_cidrs: []
    tls:
      enabled: false

api:
  mode: lab_static_bearer
  ui_session:
    enabled: true
    lifetime: 30m
    idle_timeout: 10m
    cookie_secure: false
    cookie_same_site: strict
  mcp:
    allowed_origins: []
    require_origin: false
  bootstrap_tokens:
    - id: lab-admin
      token:
        file: /run/secrets/api_admin_token
      scopes:
        - state:read
        - state:write
        - config:reload
        - config:export
        - policy:test
        - events:read
        - tokens:manage
        - runtime:reset
      expires_at: null
  rate_limits:
    enabled: true
    per_token_requests_per_second: 50
    per_token_burst: 100
    unauthenticated_requests_per_second: 5
    unauthenticated_burst: 10

limits:
  max_username_bytes: 253
  max_port_bytes: 253
  max_remote_address_bytes: 253
  max_authentication_rounds: 16
  max_authorization_arguments: 256
  max_argument_bytes: 65535
  max_command_bytes: 65535
  max_policy_trace_steps: 1000
  max_event_payload_bytes: 65536

clients:
  - id: lab-switches
    display_name: Lab switches
    priority: 100
    enabled: true
    match:
      mode: address_and_certificate
      source_cidrs:
        - 10.20.0.0/16
        - 2001:db8:20::/48
    endpoints:
      - id: tacacs-legacy
        protocol: tacacs
        transport: tcp
        roles: [authentication, authorization, accounting]
        tacacs:
          shared_secret:
            file: /run/secrets/lab_switches_tacacs_secret
          shared_secret_lifecycle:
            last_rotated_at: 2026-08-01T00:00:00Z
            rotation_interval: 90d
          allowed_methods:
            - ascii
            - pap
            - chap
            - mschapv1
            - mschapv2
            - enable
            - ascii_chpass
          default_service: login
          default_group_ids:
            - readonly
          accounting:
            enabled: true
            accept_start: true
            accept_stop: true
            accept_watchdog: true
      - id: radius-udp
        protocol: radius
        transport: udp
        roles: [access, accounting]
        radius:
          shared_secret:
            file: /run/secrets/lab_switches_radius_secret
          require_message_authenticator: true
          limit_proxy_state: true
          allowed_authentication_methods: [pap, chap]
          access_policy_id: default-radius-access
          accounting:
            accept_status_types: [start, stop, interim_update, accounting_on, accounting_off]

  - id: secure-routers
    display_name: TLS lab routers
    priority: 50
    enabled: true
    match:
      mode: address_and_certificate
      source_cidrs:
        - 10.30.0.0/16
        - 2001:db8:30::/48
      transports:
        - tls
      certificate:
        dns_sans:
          - router-01.lab.example
          - router-02.lab.example
        ip_sans:
          - 10.30.0.11
          - 10.30.0.12
    authentication:
      allowed_methods:
        - ascii
        - pap
        - chap
        - mschapv1
        - mschapv2
        - enable
        - ascii_chpass
    authorization:
      default_group_ids:
        - readonly
    accounting:
      enabled: true

groups:
  - id: administrators
    display_name: Full administrators
    priority: 10
    enabled: true
    services:
      - service: shell
        protocol: null
        action: permit
        reply_attributes:
          - name: priv-lvl
            separator: "="
            value: "15"
    command_rules:
      - id: permit-all
        priority: 10
        action: permit
        command:
          pattern: ".*"
        arguments:
          pattern: ".*"
        reason: Full lab administration
    default_command_action: deny

  - id: readonly
    display_name: Read-only operators
    priority: 100
    enabled: true
    services:
      - service: shell
        protocol: null
        action: permit
        reply_attributes:
          - name: priv-lvl
            separator: "="
            value: "1"
    command_rules:
      - id: show
        priority: 10
        action: permit
        command:
          exact: show
        arguments:
          pattern: ".*"
        reason: Permit operational show commands
      - id: ping
        priority: 20
        action: permit
        command:
          exact: ping
        arguments:
          pattern: ".*"
      - id: traceroute
        priority: 30
        action: permit
        command:
          pattern: "^(traceroute|traceroute6)$"
        arguments:
          pattern: ".*"
      - id: deny-everything-else
        priority: 10000
        action: deny
        command:
          pattern: ".*"
        arguments:
          pattern: ".*"
        reason: Default deny
    default_command_action: deny

users:
  - id: lab-admin
    display_name: Lab Administrator
    enabled: true
    group_ids:
      - administrators
    rules:
      services: []
      command_rules: []
    credentials:
      login:
        verifier:
          file: /run/secrets/lab_admin_argon2id
      challenge:
        secret:
          file: /run/secrets/lab_admin_challenge_secret
      enable:
        verifier:
          file: /run/secrets/lab_admin_enable_argon2id
    restrictions:
      client_ids: []
      valid_after: null
      valid_before: null

  - id: lab-readonly
    display_name: Read-only Lab User
    enabled: true
    group_ids:
      - readonly
    credentials:
      login:
        verifier:
          file: /run/secrets/lab_readonly_argon2id
    restrictions:
      client_ids:
        - lab-switches
        - secure-routers

  - id: lab-disabled
    display_name: Disabled Lab User
    enabled: false
    group_ids:
      - readonly
    credentials:
      login:
        verifier:
          file: /run/secrets/lab_disabled_argon2id

radius_reply_profiles:
  - id: lab-accept
    attributes:
      - name: Session-Timeout
        value: "600"

radius_policies:
  - id: default-radius-access
    rules:
      - id: permit-administrators
        match:
          groups_any: [administrators]
        effect: permit
        reply_profiles: [lab-accept]
      - id: deny-rest
        effect: deny

fallback_rules:
  services: []
  command_rules: []

events:
  ring_buffer_capacity: 10000
  include_successful_authentication: true
  include_failed_authentication: true
  include_authorization: true
  include_accounting: true
  redact_user_input: true
  stdout:
    enabled: true
    format: json

observability:
  metrics:
    enabled: true
    bind: 127.0.0.1:9090
    path: /metrics
    expose_on_admin: false
  tracing:
    enabled: false
  profiling:
    enabled: false
