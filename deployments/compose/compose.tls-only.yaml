# Overlay: TLS-only TACACS profile (no legacy listener, no host port 49).
# RADIUS/UDP host maps stay published so a later combined TLS+RADIUS YAML can bind.
# docker compose -f deployments/compose/compose.yaml -f deployments/compose/compose.tls-only.yaml up -d
services:
  taclab:
    ports: !override
      - target: 4300
        published: ${TACLAB_TLS_PORT:-300}
        protocol: tcp
      - target: 8080
        published: ${TACLAB_HTTP_PORT:-8080}
        protocol: tcp
      - target: 1812
        published: ${TACLAB_RADIUS_ACCESS_PORT:-1812}
        protocol: udp
      - target: 1813
        published: ${TACLAB_RADIUS_ACCT_PORT:-1813}
        protocol: udp
      - target: 3799
        published: ${TACLAB_RADIUS_DYNAUTH_PORT:-3799}
        protocol: udp
    volumes: !override
      - type: bind
        source: ./config/taclab.tls-only.yaml
        target: /etc/taclab/taclab.yaml
        read_only: true
      - type: bind
        source: ./certs-public
        target: /etc/taclab/certs-public
        read_only: true
