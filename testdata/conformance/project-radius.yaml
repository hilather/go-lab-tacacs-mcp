# Machine-readable project RADIUS completeness registry.
# File prefix is PRJ-*. These rows are RADIUS MVP project requirements.
# They are not TACACS 1.0 -release gates until RADIUS is advertised.
schema_version: 1
rfc: "PROJECT"
title: Project RADIUS completeness
rows:
  - id: PRJ-SEC-001
    section: authentication-and-integrity
    section_title: Authentication and integrity
    level: PROJECT MUST
    requirement: Missing/invalid required Message-Authenticator silently discards with bounded diagnostics
    evidence_required: discard_missing_message_authenticator / discard_invalid_message_authenticator
    status: PASS
    evidence:
      - unit:internal/radius/server.TestCheckAccessIntegrityMAAndProxyState
      - unit:internal/radius/udp.TestUDPIntegrityDiscardsDoNotMutateCache
      - unit:internal/radius/server.TestAccessDiscardsInvalidMA
  - id: PRJ-SEC-002
    section: authentication-and-integrity
    section_title: Authentication and integrity
    level: PROJECT MUST
    requirement: Unknown/ambiguous clients and invalid authenticators receive no useful response
    evidence_required: Silent discard; no oracular errors
    status: PASS
    evidence:
      - unit:internal/radius/udp.TestUnknownClientDiscardUsesCompiledRADIUSIndex
      - unit:internal/radius/udp.TestUnknownAccountingClientUsesCompiledRADIUSIndex
      - unit:internal/radius/server.TestAccountingValidatesRequestAuthenticator
      - unit:internal/config.TestRADIUSIndexUnknownSource
  - id: PRJ-POL-001
    section: access-behavior
    section_title: Access behavior
    level: PROJECT MUST
    requirement: Policy result is deterministic and reply attributes are role/type validated
    evidence_required: Default deny; compile-time packet-role legality
    status: PASS
    evidence:
      - unit:internal/policy/radius.TestEvaluateDefaultDenyUnknownClient
      - unit:internal/policy/radius.TestCompileRejectsIllegalReplyRole
      - unit:internal/policy/radius.TestGoldenTraces
      - unit:internal/radius/server.TestAccessIllegalAcceptAttrsFailClosed
      - unit:internal/aaa.TestAuthenticateAccessPermitFromCompiledPolicy
      - race:internal/policy/radius.TestEvaluateConcurrent
  - id: PRJ-POL-002
    section: access-behavior
    section_title: Access behavior
    level: PROJECT MUST
    requirement: v2 users/groups attach radius_policy_id; evaluation is user then effectiveGroups then client then fallback then default deny
    evidence_required: v1 unknown-field reject; frozen walk goldens; REST/MCP/parity
    status: PASS
    evidence:
      - unit:internal/config.TestV2ParsesUserAndGroupRADIUSPolicyID
      - unit:internal/config.TestV2RejectsUnknownUserRADIUSPolicyID
      - unit:internal/policy/radius.TestEvaluateUserPolicyBeforeGroupAndClient
      - unit:internal/policy/radius.TestEvaluateGroupPriorityThenID
      - unit:internal/policy/radius.TestGoldenUserGroupTraces
      - unit:internal/aaa.TestAuthenticateAccessUserPolicyWinsBeforeClient
      - unit:internal/api/operations.TestUsersGroupsRADIUSPolicyIDCreateUpdateGetExport
      - unit:internal/api/parity.TestParityRequiredEquivalence
      - adr:docs/decisions/0029-user-group-radius-policy-attachment.md
  - id: PRJ-ERR-001
    section: access-behavior
    section_title: Access behavior
    level: PROJECT MUST
    requirement: Discard/reject/internal/overload mapping is stable and non-oracular
    evidence_required: Frozen reason_code to wire/cache table
    status: PASS
    evidence:
      - unit:internal/radius/server.TestReasonTableStable
      - unit:internal/radius/server.TestAccessExtractRejects
      - unit:internal/radius/server.TestWireAccessReasonChallengeCodes
      - unit:internal/radius/server.TestAccessUnknownStateRejects
      - unit:internal/radius/udp.TestInvalidCodeAndShortDatagramDiscard
  - id: PRJ-ACCT-001
    section: accounting-behavior
    section_title: Accounting behavior
    level: PROJECT MUST
    requirement: Retransmission replays exact response and emits one accounting event
    evidence_required: Exact cache plus semantic journal excluding Acct-Delay-Time
    status: PASS
    evidence:
      - unit:internal/radius/server.TestAccountingJournalHitDoesNotRerecord
      - unit:internal/radius/udp.TestAccountingExactRetryAndDelayTimeAndInterim
      - unit:internal/radius/server.TestAccountingInterimNotCollapsed
  - id: PRJ-ACCT-002
    section: accounting-behavior
    section_title: Accounting behavior
    level: PROJECT MUST
    requirement: Accounting/event storage is bounded, redacted, and documented as memory-only
    evidence_required: Journal/ring caps; ambiguous-identity sample budget
    status: PASS
    evidence:
      - unit:internal/radius/udp.TestJournalSeenRememberExpirySaturation
      - unit:internal/radius/udp.TestJournalByteSaturation
      - unit:internal/radius/server.TestAccountingAmbiguousIdentitySampled
      - unit:internal/aaa.TestRecordRADIUSAccountingRedactsSensitiveAttributes
      - race:internal/aaa.TestRecordRADIUSAccountingRace
  - id: PRJ-RUN-001
    section: runtime-and-compatibility
    section_title: Runtime and compatibility
    level: PROJECT MUST
    requirement: Listener queues/workers/cache/state/output have hard limits and recover after overload
    evidence_required: drop_overload; cache/journal saturation metrics
    status: PASS
    evidence:
      - unit:internal/radius/udp.TestCacheAbandonAndExpiryAndSaturation
      - unit:internal/radius/udp.TestJournalSeenRememberExpirySaturation
      - unit:internal/radius/udp.TestSourceLimiterBurstThenRefill
