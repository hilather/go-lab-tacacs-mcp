    section: access-request
    section_title: Access-Request
    level: PROJECT MUST
    requirement: RADIUS MS-CHAPv1/v2 via RFC 2548 vendor 311 VSAs with independent RADIUS wire vectors; must_change is Access-Reject with no MS-CHAP-Error
    evidence_required: Independent testdata/protocol/radius/mschap vectors; testclient encode/decode; live UDP acceptance; REST/MCP method union
