  - id: R65-CHAP-001
    section: authentication-and-integrity
    section_title: Authentication and integrity
    level: MUST
    requirement: Validate CHAP evidence/challenge selection
    evidence_required: CHAP-Password length 17; CHAP-Challenge else Request Authenticator
    status: PASS
    evidence:
      - unit:internal/radius/server.TestAccessCHAPUsesChallengeOrRequestAuthenticator
      - unit:internal/radius/server.TestAccessExtractRejects
      - unit:internal/radius/udp.TestUDPPAPAndCHAPRejectPaths
  - id: R65-ACCESS-001
    section: access-behavior
    section_title: Access behavior
    level: MUST
    requirement: Parse and validate Access-Request
    evidence_required: Required identity/evidence rules; conflicting methods reject
    status: PASS
    evidence:
