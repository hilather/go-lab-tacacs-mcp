schema_version: 1
rfc: "2865"
title: RFC 2865 RADIUS
rows:
  - id: R65-PKT-001
    section: packet-and-attribute-framing
    section_title: Packet and attribute framing
    level: MUST
    requirement: Enforce packet length/header bounds
    evidence_required: Minimum 20, maximum 4096, padding and short-packet handling
    status: PASS
    evidence:
      - unit:internal/radius/codec.TestDecodeHeaderTruncation
      - unit:internal/radius/codec.TestDecodeIgnoresTrailingPadding
      - unit:internal/radius/codec.TestDecodeRejectsDeclaredOverRFCMax
      - unit:internal/radius/codec.TestRadiusCatalog
      - unit:internal/radius/testclient/codec.TestIndependentCatalogBytes
      - unit:internal/radius/codec.TestPeerEncodeDecodeCatalogBytes
      - golden:testdata/protocol/radius/vectors.json
      - fuzz:internal/radius/codec.FuzzRadiusPacketDecode
      - bench:internal/radius/codec.BenchmarkRadiusPacketDecode_8Attrs
  - id: R65-PKT-002
    section: packet-and-attribute-framing
    section_title: Packet and attribute framing
    level: MUST
    requirement: Handle supported/unsupported Codes deterministically
    evidence_required: Invalid code silently discarded; supported codes decoded
    status: PASS
    evidence:
      - unit:internal/radius/codec.TestCodeClassification
      - unit:internal/radius/codec.TestDecodeUnknownCodePreserved
      - unit:internal/radius/codec.TestDecodeAccessChallenge
      - unit:internal/radius/udp.TestInvalidCodeAndShortDatagramDiscard
      - unit:internal/radius/server.TestStubDiscardsWrongCode
      - unit:internal/radius/testclient/codec.TestIndependentCatalogBytes
      - golden:testdata/protocol/radius/packets/access-challenge-min.bin
  - id: R65-ATTR-001
    section: packet-and-attribute-framing
    section_title: Packet and attribute framing
    level: MUST
    requirement: Validate Type/Length/Value framing
    evidence_required: Length >= 2 and within remaining declared payload; overflow discards
    status: PASS
    evidence:
      - unit:internal/radius/attribute.TestDecodeRejectsShortLength
      - unit:internal/radius/attribute.TestDecodeRejectsOverflow
      - unit:internal/radius/codec.TestDecodeAttributeOverflow
      - unit:internal/radius/testclient/codec.TestIndependentCatalogBytes
      - fuzz:internal/radius/attribute.FuzzRadiusAttributeDecode
  - id: R65-ATTR-002
    section: packet-and-attribute-framing
    section_title: Packet and attribute framing
    level: MUST
    requirement: Preserve ordered duplicate attributes
    evidence_required: Order and duplicates survive decode/encode
    status: PASS
    evidence:
      - unit:internal/radius/attribute.TestDecodePreservesOrderAndDuplicates
      - unit:internal/radius/codec.TestRoundTripWithAttributes
      - unit:internal/radius/codec.TestPeerConstructedPacketBytes
      - golden:testdata/protocol/radius/packets/access-request-dup-proxy-state.bin
  - id: R65-VSA-001
    section: packet-and-attribute-framing
    section_title: Packet and attribute framing
    level: MUST
    requirement: Parse/encode VSA framing and preserve unknown vendor data safely
    evidence_required: Vendor-Specific (26) framing; unknown VSA payloads preserved raw
    status: PASS
    evidence:
      - unit:internal/radius/attribute.TestParseVSARoundTrip
      - unit:internal/radius/attribute.TestParseVSAUnknownVendorPreserved
      - unit:internal/radius/attribute.TestPacketKeepsMalformedVSARaw
      - unit:internal/radius/attribute.TestParseVendorTLVsMultipleAndUnknown
      - unit:internal/radius/codec.TestVSAGoldenFraming
      - unit:internal/radius/testclient/codec.TestIndependentVSAFraming
      - fuzz:internal/radius/attribute.FuzzRadiusVSA
      - fuzz:internal/radius/attribute.FuzzRadiusVendorTLVs
      - golden:testdata/protocol/radius/packets/access-request-vsa.bin
  - id: R65-PROXY-001
    section: packet-and-attribute-framing
    section_title: Packet and attribute framing
    level: MUST
    requirement: Preserve Proxy-State order/value in responses
    evidence_required: Unmodified Proxy-State copied in order after Message-Authenticator
    status: PASS
    evidence:
      - unit:internal/radius/server.TestSignResponseMAFirstThenResponseAuthenticator
      - unit:internal/radius/server.TestAccessPermitEmitsAcceptWithProfileAttrs
      - golden:testdata/protocol/radius/packets/access-request-dup-proxy-state.bin
  - id: R65-RAUTH-001
    section: authentication-and-integrity
    section_title: Authentication and integrity
    level: MUST
    requirement: Validate/generate request and response authenticators
    evidence_required: Response Authenticator vectors; Access-Request authenticator is a nonce
    status: PASS
    evidence:
      - unit:internal/radius/crypto.TestNewRequestAuthenticatorIsNonce
      - unit:internal/radius/crypto.TestResponseAuthenticatorVectors
      - unit:internal/radius/testclient/codec.TestIndependentResponseAuthenticatorVectors
      - unit:internal/radius/crypto.TestPeerResponseAuthenticatorBytes
      - golden:testdata/protocol/radius/crypto/vectors.json
      - bench:internal/radius/crypto.BenchmarkResponseAuthenticator
  - id: R65-PAP-001
    section: authentication-and-integrity
    section_title: Authentication and integrity
    level: MUST
    requirement: Correct User-Password hide/unhide and block/length checks
    evidence_required: Independent hide/unhide vectors; wipe plaintext
    status: PASS
