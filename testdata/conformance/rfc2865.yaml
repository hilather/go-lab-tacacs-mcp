      - unit:internal/radius/udp.TestUDPPAPAndCHAPRejectPaths
      - unit:internal/radius/testclient.TestEncodeAccessRequestRejectsConflict
      - unit:internal/aaa.TestAuthenticateAccessDefaultDenyAndRejects
  - id: R65-ACCESS-002
    section: access-behavior
    section_title: Access behavior
    level: MUST
    requirement: Construct valid Access-Accept
    evidence_required: Identifier, Response Authenticator, Message-Authenticator first, reply attributes
    status: PASS
    evidence:
