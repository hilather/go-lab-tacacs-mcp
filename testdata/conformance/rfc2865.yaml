      - unit:internal/radius/udp.TestUDPPAPAcceptFromCompiledPolicy
      - unit:internal/radius/udp.TestIndependentTestclientPAPAndAccountingOnUDP
      - unit:internal/radius/testclient.TestAccessReplyRequiresMessageAuthenticator
      - interop:internal/radius/udp.TestIndependentTestclientPAPAndAccountingOnUDP
  - id: R65-ACCESS-003
    section: access-behavior
    section_title: Access behavior
    level: MUST
    requirement: Construct valid Access-Reject
    evidence_required: Correct response and permitted reject attributes
    status: PASS
    evidence:
